openapi: 3.0.3

info:
  title: Auth Microservice API
  description: |
    Authentication and authorization microservice built with Node.js, Express, and MySQL.

    ## Authentication
    Most protected endpoints require a Bearer token in the `Authorization` header:
    ```
    Authorization: Bearer <accessToken>
    ```
    The `refreshToken` is managed automatically via an httpOnly cookie — you do not send it in the request body.

    ## Standard Response Envelope
    All responses follow this shape:
    ```json
    { "statusCode": 200, "data": {}, "message": "...", "success": true }
    ```
    Errors follow:
    ```json
    { "statusCode": 400, "data": null, "message": "...", "success": false, "errors": [] }
    ```
  version: "1.0.0"
  contact:
    name: Auth Microservice

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

tags:
  - name: Auth
    description: User registration, login, logout, and token management
  - name: OAuth
    description: Google OAuth 2.0 sign-in flow
  - name: Password
    description: Forgot password, reset password, and change password flows
  - name: Users
    description: Admin-only user management endpoints
  - name: Healthcheck
    description: Server and database health status
  - name: Documents
    description: File upload

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 200
        data:
          type: object
        message:
          type: string
          example: Success
        success:
          type: boolean
          example: true

    ApiError:
      type: object
      properties:
        statusCode:
          type: integer
          example: 400
        data:
          nullable: true
          example: null
        message:
          type: string
          example: Validation error
        success:
          type: boolean
          example: false
        errors:
          type: array
          items:
            type: string

    User:
      type: object
      properties:
        userId:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        email:
          type: string
          format: email
          example: "user@example.com"
        firstName:
          type: string
          example: "Jane"
        lastName:
          type: string
          example: "Doe"
        phoneNumber:
          type: string
          example: "+919876543210"
        avatar:
          type: string
          nullable: true
          example: null
        roleId:
          type: string
          example: "USER"

    PaginatedUsers:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
          example: 42
        limit:
          type: integer
          example: 20
        page:
          type: integer
          example: 1

# ---------------------------------------------------------------------------
# Auth routes — /api/v1/users
# ---------------------------------------------------------------------------
paths:
  /users/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Creates a new user account with email and password. Returns the created user object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  minLength: 8
                  example: "securepassword123"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: "#/components/schemas/User"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: User with this email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /users/login:
    post:
      tags: [Auth]
      summary: Login
      description: |
        Authenticates the user. Returns an `accessToken` in the response body and sets a
        `refreshToken` as an httpOnly cookie automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  example: "securepassword123"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: "#/components/schemas/User"
                          accessToken:
                            type: string
                            example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "400":
          description: Email and password are required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /users/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Clears the `refreshToken` cookie and invalidates the server-side refresh token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: Unauthorized — missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /users/refresh-token:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: |
        Issues a new access token using the `refreshToken` httpOnly cookie (sent automatically by
        the browser). Also rotates the refresh token — the new one is set as a cookie.
      responses:
        "200":
          description: Access token refreshed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                            example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "401":
          description: Refresh token missing or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /users/current-user:
    get:
      tags: [Auth]
      summary: Get current user
      description: Returns the profile of the currently authenticated user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user fetched successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ---------------------------------------------------------------------------
  # Password routes
  # ---------------------------------------------------------------------------
  /users/forgot-password:
    post:
      tags: [Password]
      summary: Request a password reset OTP
      description: Sends a 6-digit OTP to the provided email address if an account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
      responses:
        "200":
          description: Password reset OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: User not found or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /users/verify-otp:
    post:
      tags: [Password]
      summary: Verify OTP and reset password
      description: Resets the user password using the 6-digit OTP sent to their email. OTP expires in 5 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, newPassword, inputedOtp]
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                newPassword:
                  type: string
                  minLength: 8
                  example: "newSecurePassword123"
                inputedOtp:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: OTP expired or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /users/change-password:
    post:
      tags: [Password]
      summary: Change current password
      description: Allows an authenticated user to change their own password.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword:
                  type: string
                  example: "currentPassword123"
                newPassword:
                  type: string
                  minLength: 8
                  example: "newSecurePassword456"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Old password is incorrect or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ---------------------------------------------------------------------------
  # Admin user management routes
  # ---------------------------------------------------------------------------
  /users:
    get:
      tags: [Users]
      summary: Get all users (admin)
      description: Returns a paginated list of all users. Requires ADMIN role.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number (1-indexed)
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Number of users per page (max 100)
      responses:
        "200":
          description: Users fetched successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PaginatedUsers"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden — ADMIN role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    post:
      tags: [Users]
      summary: Add a new user (admin)
      description: Creates a new user with a specified role. Requires ADMIN role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, firstName, roleId]
              properties:
                email:
                  type: string
                  format: email
                  example: "newuser@example.com"
                password:
                  type: string
                  minLength: 8
                  example: "temporaryPassword123"
                firstName:
                  type: string
                  example: "John"
                roleId:
                  type: string
                  enum: [ADMIN, USER, MANAGER]
                  example: "USER"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: "#/components/schemas/User"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden — ADMIN role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: User with this email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /users/{userId}:
    patch:
      tags: [Users]
      summary: Edit user details (admin)
      description: |
        Updates profile fields for a specific user. Requires ADMIN role.
        Restricted fields (`password`, `email`, `roleId`, etc.) cannot be changed via this endpoint.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the user to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  example: "Jane"
                lastName:
                  type: string
                  example: "Doe"
                phone:
                  type: string
                  example: "+919876543210"
                avatar:
                  type: string
                  example: "https://example.com/avatar.png"
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "400":
          description: Validation error or restricted field attempted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden — ADMIN role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    delete:
      tags: [Users]
      summary: Delete a user (admin)
      description: Permanently deletes a user by userId. Requires ADMIN role.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the user to delete
      responses:
        "200":
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden — ADMIN role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ---------------------------------------------------------------------------
  # Google OAuth 2.0 — /api/v1/auth
  # ---------------------------------------------------------------------------
  /auth/google:
    get:
      tags: [OAuth]
      summary: Start Google sign-in
      description: |
        Redirects the browser to Google's OAuth 2.0 consent screen.

        **Frontend usage:** link or navigate to this URL directly — do not call
        it with `fetch`/`axios` because the response is a browser redirect.

        Requires these environment variables to be set on the server:
        - `GOOGLE_CLIENT_ID`
        - `GOOGLE_CLIENT_SECRET`
        - `GOOGLE_CALLBACK_URL`
      responses:
        "302":
          description: Redirect to Google consent screen
        "501":
          description: Google OAuth not configured on this server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/google/callback:
    get:
      tags: [OAuth]
      summary: Google OAuth callback
      description: |
        Google redirects here with a one-time authorization `code` after the
        user grants (or denies) permission.

        **Do not call this endpoint directly.** It is invoked automatically by
        Google as part of the OAuth flow.

        On success:
        - Sets a `refreshToken` httpOnly cookie.
        - Redirects to `OAUTH_SUCCESS_REDIRECT_URL?accessToken=...&userId=...`
          (or `/api/v1/auth/google/success` as fallback).

        On failure (e.g. user denied):
        - Redirects to `OAUTH_FAILURE_REDIRECT_URL?error=...`
          (or `/api/v1/auth/google/failed` as fallback).
      parameters:
        - name: code
          in: query
          description: One-time authorization code from Google
          schema:
            type: string
        - name: state
          in: query
          description: CSRF state token (must match the session value)
          schema:
            type: string
        - name: error
          in: query
          description: Error code if the user denied access (e.g. `access_denied`)
          schema:
            type: string
      responses:
        "302":
          description: Redirect to success or failure URL
        "400":
          description: Missing code or invalid state (CSRF)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Upstream Google API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/google/success:
    get:
      tags: [OAuth]
      summary: OAuth success fallback
      description: |
        Fallback endpoint used when `OAUTH_SUCCESS_REDIRECT_URL` is not
        configured. Returns the access token as JSON — useful for API clients
        and local testing.
      parameters:
        - name: accessToken
          in: query
          required: true
          schema:
            type: string
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Google sign-in successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                            example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                          userId:
                            type: string
                            format: uuid
        "400":
          description: Missing access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/google/failed:
    get:
      tags: [OAuth]
      summary: OAuth failure fallback
      description: |
        Fallback endpoint used when `OAUTH_FAILURE_REDIRECT_URL` is not
        configured. Returns a JSON error — useful for API clients.
      parameters:
        - name: error
          in: query
          schema:
            type: string
            example: "access_denied"
      responses:
        "401":
          description: Google sign-in failed or was cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ---------------------------------------------------------------------------
  # Healthcheck
  # ---------------------------------------------------------------------------
  /healthcheck:
    get:
      tags: [Healthcheck]
      summary: Health check
      description: Returns server uptime, database connectivity, app version, and environment. Returns 503 if the DB is unreachable.
      responses:
        "200":
          description: Server and database are healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          uptime:
                            type: integer
                            description: Server uptime in seconds
                            example: 3600
                          db:
                            type: string
                            enum: [ok, error]
                            example: "ok"
                          version:
                            type: string
                            example: "1.0.0"
                          environment:
                            type: string
                            example: "development"
                          timestamp:
                            type: string
                            format: date-time
                            example: "2026-03-16T12:00:00.000Z"
        "503":
          description: Database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  # ---------------------------------------------------------------------------
  # Document upload
  # ---------------------------------------------------------------------------
  /documents/upload:
    post:
      tags: [Documents]
      summary: Upload a file
      description: Uploads a single file using multipart/form-data. Returns metadata about the uploaded file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: File uploaded successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          file:
                            type: object
                            properties:
                              originalname:
                                type: string
                                example: "document.pdf"
                              filename:
                                type: string
                                example: "1710587200000-document.pdf"
                              mimetype:
                                type: string
                                example: "application/pdf"
                              size:
                                type: integer
                                example: 204800
        "400":
          description: No file uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: File upload failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
